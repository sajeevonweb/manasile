    <script>
      // GitHub Pages SPA redirect receiver
      // Reads the path encoded by 404.html and restores it via history.replaceState
      // so React Router sees the correct URL on load.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();

      // Also handle the ?p= query string approach from 404.html
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var query = params.get('q') ? '?' + params.get('q').replace(/~and~/g, '&') : '';
          var hash = params.get('h') ? '#' + params.get('h') : '';
          history.replaceState(null, null, p + query + hash);
        }
      })();
    </script>
